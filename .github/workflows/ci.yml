name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: HTML and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML
        run: npx --yes htmlhint index.html
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check required frontend files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js

  python:
    name: Python checks (when added)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax if Python files exist
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f -name '*.py' -not -path './.git/*' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No Python files yet; skipping syntax checks."
          else
            python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path(".").rglob("*.py"):
              if ".git" in path.parts:
                  continue
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("OK:", path)
          PY
          fi
      - name: Run Python unit tests if tests directory exists
        shell: bash
        run: |
          if [[ -d tests ]] && find tests -name 'test*.py' -print -quit | grep -q .; then
            python -m unittest discover -s tests -p 'test*.py'
          else
            echo "No Python unit tests yet; skipping."
          fi
