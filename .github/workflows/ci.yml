name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend lint and behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality and browser tools
        run: |
          npm install --no-save --no-package-lock htmlhint eslint@9 @eslint/js@9 globals@15 stylelint@16 stylelint-config-standard@36 @playwright/test
          npx playwright install --with-deps chromium
      - name: HTML lint
        run: npx htmlhint index.html
      - name: JavaScript lint
        run: npx eslint script.js
      - name: CSS lint
        run: npx stylelint style.css
      - name: JavaScript behavior tests
        run: node --test tests/*.test.mjs
      - name: Browser language behavior tests
        run: npx playwright test
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  python:
    name: Python quality and tests (when added)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python when added
        shell: bash
        run: |
          if ! find . -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "No Python source yet; checks not applicable."
            exit 0
          fi
          python -m pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
          pylint backend tests/test_backend.py
          mypy .
          pytest
