name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install quality tools
        run: npm install --no-save --no-package-lock htmlhint eslint@9 @eslint/js@9 globals@15 stylelint@16 stylelint-config-standard@36
      - name: HTML lint
        run: npx htmlhint index.html
      - name: JavaScript lint
        run: npx eslint script.js
      - name: CSS lint
        run: npx stylelint style.css
      - name: JavaScript behavior tests
        run: node --test tests/*.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python when added
        shell: bash
        run: |
          if ! find . -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "No Python source yet."
            exit 0
          fi
          python -m pip install ruff mypy pytest
          ruff check .
          ruff format --check .
          mypy .
          if find . -name 'test_*.py' -print -quit | grep -q .; then
            pytest
          fi
