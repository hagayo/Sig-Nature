<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sig-Nature</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="photo">
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="/">Sig-Nature</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/" data-i18n="navGenerate">יצירת חתימה</a>
        <a href="/analyze-photo.html" data-i18n="navPhoto" aria-current="page">ניתוח תמונה</a>
        <a href="/analyze-signature.html" data-i18n="navSignature">ניתוח חתימה</a>
      </nav>
      <button class="button button-secondary" id="language-toggle" type="button" aria-label="Switch to English">English</button>
    </header>
    <h1 data-i18n="titlePhoto">תנתח את התמונה שלי</h1>
    <form class="form-grid" id="photo-analysis-form">
      <label class="field"><span data-i18n="portrait">תמונת פנים</span><input id="analysis-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label>
      <label class="field"><span data-i18n="apiKey">מפתח API</span><input id="api-key" name="api_key" type="password" autocomplete="off" required></label>
      <button class="button" id="analyze" type="submit" data-i18n="analyzePhoto">נתח תמונה</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="result-panel" id="results" hidden>
      <p class="result-text" id="analysis-description"></p>
      <h2 class="result-title" data-i18n="visualTraits">מאפיינים חזותיים</h2>
      <dl class="metric-list" id="analysis-details"></dl>
      <h2 class="result-title" data-i18n="writingEffects">השפעה על החתימה</h2>
      <dl class="metric-list" id="writing-details"></dl>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
