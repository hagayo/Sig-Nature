<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sig-Nature</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Sig-Nature</h1>
      <button id="language-toggle" type="button" aria-label="Switch to English">English</button>
    </header>
    <form id="signature-form">
      <label><span data-i18n="fullName">שם מלא</span><input id="full-name" required autocomplete="name" placeholder="שם מלא"></label>
      <label><span data-i18n="portrait">תמונת פנים</span><input id="portrait" type="file" accept="image/png,image/jpeg,image/webp" required></label>
      <label><span data-i18n="apiKey">מפתח API</span><input id="api-key" type="password" required autocomplete="off"></label>
      <button id="generate" type="submit" data-i18n="generate">הפעל</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" hidden>
      <img id="signature-preview" alt="חתימה על רקע שקוף">
      <a id="download-png" download="signature.png" data-i18n="downloadPng">הורדת חתימה PNG</a>
      <video id="animation-preview" controls playsinline></video>
      <a id="download-video" download="signature.mp4" data-i18n="downloadVideo">הורדת סרטון</a>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
