<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sig-Nature</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Sig-Nature</h1><form id="signature-form"><label>שם מלא<input id="full-name" required autocomplete="name" placeholder="חגי און"></label><label>תמונת פנים<input id="portrait" type="file" accept="image/*" required></label><label>מפתח API<input id="api-key" type="password" required autocomplete="off"></label><button id="generate" type="submit">הפעל</button></form><p id="status" role="status" aria-live="polite"></p><section id="results" hidden><img id="signature-preview" alt="חתימה על רקע שקוף"><a id="download-png" download="signature.png">הורדת חתימה PNG</a><video id="animation-preview" controls playsinline></video><a id="download-video" download="signature.webm">הורדת סרטון</a></section></main><script src="script.js"></script></body></html>
